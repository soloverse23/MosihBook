<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;
       font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a1a1a}
  .card{background:#fff;width:min(380px,92vw);padding:32px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  h1{margin:0 0 20px;font-size:22px;text-align:center}
  label{display:block;margin:14px 0 6px;font-size:14px}
  input{width:100%;padding:11px 12px;border:1px solid #cfd3d9;border-radius:8px;font-size:15px}
  input:focus{outline:2px solid #4f46e5;border-color:transparent}
  button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#c0262d;font-size:14px;margin-top:12px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>Sign in to your account</h1>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button id="b">Sign in</button>
    <div class="err" id="e"></div>
  </form>
</div>
<script>
// only allow same-site relative paths as redirect target
const q = new URLSearchParams(location.search).get('next');
const next = q && /^\/[A-Za-z0-9_-]*$/.test(q) ? q : '/dashboard';

fetch('/api/me').then(r => r.json()).then(d => { if (d.ok) location.replace(next); }).catch(() => {});

f.onsubmit = async (ev) => {
  ev.preventDefault();
  b.disabled = true; e.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u.value.trim(), password: p.value})
    });
    if (r.ok) return location.replace(next);
    e.textContent = 'Incorrect username or password';
  } catch { e.textContent = 'Connection error'; }
  b.disabled = false;
};
</script>
</body>
</html>
